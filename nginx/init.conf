# Temporary HTTP-only config used to obtain the initial SSL certificate
server {
    listen 80;
    server_name crm.tgailab.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Setting up SSL...';
        add_header Content-Type text/plain;
    }
}
