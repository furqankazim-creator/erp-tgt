services:
  api:
    build:
      context: .
      target: api
    env_file: ./server/.env
    environment:
      - PORT=4000
      - NODE_ENV=production
      - CORS_ORIGINS=https://crm.tgailab.site
      # client -> caa-nginx -> web nginx -> api: two proxies in front of the API
      - TRUST_PROXY=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "3050:80"
    depends_on:
      - api
    restart: unless-stopped
